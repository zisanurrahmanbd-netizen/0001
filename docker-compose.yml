services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_recovery_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_NAME: "Bank File Recovery System"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bank_recovery
      DB_USERNAME: recovery_user
      DB_PASSWORD: recovery_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: bank_recovery_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bank_recovery
      MYSQL_USER: recovery_user
      MYSQL_PASSWORD: recovery_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bank_recovery_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local